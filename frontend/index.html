<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>简历编辑器</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- 系统层：单行紧凑顶栏 -->
      <header class="titlebar" id="titlebar">
        <div class="tb-left">
          <button
            type="button"
            class="tb-icon"
            id="btnSidebar"
            aria-label="收起侧栏"
            aria-pressed="false"
            title="收起 / 展开侧栏"
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <rect
                x="2.5"
                y="3.5"
                width="15"
                height="13"
                rx="2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path d="M7.5 3.5v13" stroke="currentColor" stroke-width="1.5" />
            </svg>
          </button>
          <span class="tb-title" id="activeFilename">简历内容.md</span>
        </div>
      </header>

      <!-- 面板层：侧栏 | 分隔条 | 编辑区 | 分隔条 | 预览 -->
      <div class="workspace" id="workspace">
        <nav class="sidebar" id="sidebar" aria-label="内容模块">
          <div class="side-head">
            <div class="workspace-segments" role="group" aria-label="工作区切换">
              <button
                type="button"
                id="tabFiles"
                data-mode="files"
                aria-pressed="false"
                aria-controls="fileNavigation fileManager"
                title="简历文件"
                ><span>文件</span></button
              >
              <button
                type="button"
                id="tabContent"
                data-mode="content"
                aria-pressed="true"
                aria-controls="contentNavigation editor"
                title="编辑内容"
                ><span>内容</span></button
              >
            </div>
          </div>
          <div class="side-navigation" id="contentNavigation">
            <button
              type="button"
              class="side-document"
              id="btnDocument"
              title="在文件中查看"
              aria-label="在文件中查看当前简历"
            >
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M5 2.5h7l3 3v12H5zM12 2.5v4h3M8 10h4M8 13h4" />
              </svg>
              <span class="side-document-name" id="sideDocumentName">通用简历</span>
              <svg class="document-link-icon" viewBox="0 0 20 20" aria-hidden="true">
                <path d="M4 10h12M11 5l5 5-5 5" />
              </svg>
            </button>
            <ul class="nav-list" id="navList"></ul>
          </div>
          <div class="side-navigation" id="fileNavigation" hidden>
            <div class="file-list-head"><span>简历文件</span><span id="fileCount">1</span></div>
            <ul class="file-list" id="fileList"></ul>
            <button
              type="button"
              class="new-file-button"
              id="btnNewDocument"
              aria-label="新建简历"
              title="新建简历"
              ><span aria-hidden="true">＋</span
              ><span class="new-file-label">新建简历</span></button
            >
          </div>
          <div class="side-status">
            <button type="button" class="side-settings" aria-label="设置" title="设置">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path
                  d="m8 2.5-.5 2a6 6 0 0 0-1.3.8l-2-.6-2 3.4 1.5 1.4a6 6 0 0 0 0 1.5l-1.5 1.4 2 3.4 2-.6a6 6 0 0 0 1.3.8l.5 2h4l.5-2a6 6 0 0 0 1.3-.8l2 .6 2-3.4-1.5-1.4a6 6 0 0 0 0-1.5l1.5-1.4-2-3.4-2 .6a6 6 0 0 0-1.3-.8l-.5-2Z"
                />
                <circle cx="10" cy="10" r="2.5" />
              </svg>
              <span class="side-settings-label">设置</span>
            </button>
            <div class="side-status-summary">
              <div class="save-state" id="saveState" aria-live="polite">
                <span class="state-dot" aria-hidden="true"></span
                ><span id="saveText">正在载入…</span>
              </div>
              <span class="side-progress" id="completionSummary">0 / 0</span>
            </div>
          </div>
        </nav>

        <div
          class="splitter"
          id="splitLeft"
          role="separator"
          aria-orientation="vertical"
          aria-label="拖动调整侧栏宽度"
          tabindex="0"
          ><span class="splitter-grip"></span
        ></div>

        <main class="editor" id="editor" aria-labelledby="groupTitle">
          <div class="editor-head">
            <h2 id="groupTitle">个人信息</h2>
            <label class="search">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <circle
                  cx="9"
                  cy="9"
                  r="5.6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <path
                  d="M13.2 13.2 17 17"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
              <input
                id="searchInput"
                type="search"
                placeholder="搜索"
                aria-label="搜索字段或内容"
              />
            </label>
          </div>
          <div class="form" id="form"></div>
        </main>

        <main class="file-manager" id="fileManager" aria-labelledby="documentTitle" hidden>
          <div class="files-heading">
            <h2 id="documentTitle">通用简历</h2>
            <button
              type="button"
              class="btn file-action danger-quiet"
              id="btnDeleteDocument"
              aria-label="删除当前简历"
              title="删除当前简历"
              aria-haspopup="dialog"
              aria-controls="deleteDocumentDialog"
            >
              <!-- lucide:trash-2 -->
            </button>
            <button
              type="button"
              class="btn file-action"
              id="btnEditDocument"
              aria-label="编辑内容"
              title="编辑内容"
            >
              <!-- lucide:pencil -->
            </button>
          </div>
          <div class="file-details">
            <dl class="document-properties">
              <div><dt>文件名</dt><dd id="documentFilename">简历内容.md</dd></div>
              <div id="documentCompanyRow" hidden><dt>公司</dt><dd id="documentCompany"></dd></div>
              <div><dt>更新于</dt><dd id="documentModified">尚未保存</dd></div>
            </dl>
            <div class="jd-editor">
              <label for="documentJD">职位描述</label>
              <textarea id="documentJD" rows="12" placeholder="粘贴岗位职责与任职要求"></textarea>
            </div>
          </div>
        </main>

        <div
          class="splitter"
          id="splitRight"
          role="separator"
          aria-orientation="vertical"
          aria-label="拖动调整预览宽度"
          tabindex="0"
          ><span class="splitter-grip"></span
        ></div>

        <section class="preview" id="preview" aria-label="简历实时预览">
          <div class="preview-head">
            <div class="preview-title">
              <p class="eyebrow">Live preview</p>
              <h2>A4 · 双页</h2>
            </div>
            <div class="zoom" role="group" aria-label="预览缩放">
              <button type="button" id="zoomOut" aria-label="缩小">−</button>
              <button type="button" id="zoomLabel" class="zoom-label" title="点击恢复自适应缩放"
                >70%</button
              >
              <button type="button" id="zoomIn" aria-label="放大">+</button>
            </div>
            <div class="preview-actions">
              <button type="button" class="btn primary" id="btnPdf">导出 PDF</button>
            </div>
          </div>
          <div class="preview-scroll" id="previewScroll">
            <div class="paper-holder" id="paperHolder">
              <div class="paper-stage" id="paperStage">
                <iframe id="previewFrame" title="简历预览" sandbox="allow-scripts"></iframe>
              </div>
            </div>
          </div>
          <div class="preview-foot">
            <span id="previewHint">页面按 A4 210 × 297 mm 渲染</span>
            <span>2 页</span>
          </div>
        </section>
      </div>

      <dialog class="document-dialog" id="newDocumentDialog" aria-labelledby="newDocumentTitle">
        <form id="newDocumentForm">
          <div class="dialog-heading"
            ><h2 id="newDocumentTitle">新建简历</h2
            ><button
              type="button"
              class="dialog-close"
              id="btnCloseDocument"
              aria-label="关闭新建窗口"
              >×</button
            ></div
          >
          <fieldset id="newDocumentFields">
            <div class="dialog-field-grid">
              <label class="dialog-field"
                >公司名称 <span>选填</span
                ><input id="newCompany" type="text" maxlength="80" placeholder="例如：星河科技"
              /></label>
              <label class="dialog-field"
                >岗位名称 <span>必填</span
                ><input
                  id="newRole"
                  type="text"
                  maxlength="80"
                  required
                  placeholder="例如：产品经理"
              /></label>
            </div>
            <label class="dialog-field"
              >职位描述 <span>选填</span
              ><textarea id="newJD" rows="5" placeholder="粘贴岗位职责与任职要求"></textarea>
            </label>
            <div class="source-heading">初始内容</div>
            <div class="document-sources">
              <label
                ><input type="radio" name="source" value="current" checked /><span
                  >复制当前简历<small id="sourceCurrentLabel">通用简历</small></span
                ></label
              >
              <label
                ><input type="radio" name="source" value="template" /><span
                  >使用默认模板</span
                ></label
              >
            </div>
          </fieldset>
          <p class="dialog-error" id="newDocumentError" role="alert"></p>
          <div class="dialog-actions"
            ><button type="button" class="btn" id="btnCancelDocument">取消</button
            ><button type="submit" class="btn" id="btnCreateDocument">创建简历</button></div
          >
        </form>
      </dialog>

      <dialog
        class="document-dialog delete-dialog"
        id="deleteDocumentDialog"
        aria-labelledby="deleteDocumentTitle"
        aria-describedby="deleteDocumentFilename deleteDocumentDescription"
      >
        <form id="deleteDocumentForm">
          <div class="dialog-heading"><h2 id="deleteDocumentTitle">删除这份简历？</h2></div>
          <p class="delete-filename" id="deleteDocumentFilename"></p>
          <p class="delete-description" id="deleteDocumentDescription"
            >简历内容和职位描述将被永久删除，无法撤销。</p
          >
          <p class="dialog-error" id="deleteDocumentError" role="alert"></p>
          <div class="dialog-actions">
            <button type="button" class="btn" id="btnCancelDeleteDocument" autofocus>取消</button>
            <button type="submit" class="btn danger" id="btnConfirmDeleteDocument">删除简历</button>
          </div>
        </form>
      </dialog>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
