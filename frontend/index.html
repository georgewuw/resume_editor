<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>简历编辑器 · A4 双页</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- 系统层：单行紧凑顶栏 -->
      <header class="titlebar" id="titlebar">
        <div class="tb-left">
          <button
            type="button"
            class="tb-icon"
            id="btnSidebar"
            aria-label="收起侧栏"
            aria-pressed="false"
            title="收起 / 展开侧栏"
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <rect
                x="2.5"
                y="3.5"
                width="15"
                height="13"
                rx="2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path d="M7.5 3.5v13" stroke="currentColor" stroke-width="1.5" />
            </svg>
          </button>
          <div class="tb-switcher">
            <button
              type="button"
              class="tb-switch"
              id="btnModules"
              aria-expanded="false"
              aria-haspopup="true"
              title="切换内容模块"
            >
              <span id="crumb">个人信息</span>
              <svg class="caret" viewBox="0 0 12 12" aria-hidden="true">
                <path
                  d="M2.5 4.5 6 8l3.5-3.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <div class="tb-menu" id="moduleMenu" role="menu" hidden></div>
          </div>
          <span class="tb-sep"></span>
          <span class="tb-context">简历内容.md <span class="tb-context-dot">·</span> A4 双页</span>
        </div>
      </header>

      <!-- 面板层：侧栏 | 分隔条 | 编辑区 | 分隔条 | 预览 -->
      <div class="workspace" id="workspace">
        <nav class="sidebar" id="sidebar" aria-label="内容模块">
          <div class="side-head">
            <p class="side-label">内容模块</p>
            <button
              type="button"
              class="side-collapse"
              id="btnCollapse"
              aria-label="收起侧栏"
              title="收起侧栏"
            >
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M10 3 5 8l5 5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <ul class="nav-list" id="navList"></ul>
          <div class="side-foot">
            <div
              class="collapsed-progress"
              id="collapsedProgress"
              role="img"
              aria-label="已填写 0 / 0 项"
            >
              <svg viewBox="0 0 40 40" aria-hidden="true">
                <circle class="collapsed-progress-track" cx="20" cy="20" r="17" />
                <circle
                  class="collapsed-progress-value"
                  id="collapsedProgressValue"
                  cx="20"
                  cy="20"
                  r="17"
                  pathLength="100"
                />
              </svg>
              <span class="collapsed-progress-count" id="collapsedProgressCount">0/0</span>
            </div>
            <div class="foot-status">
              <div class="save-state" id="saveState" aria-live="polite">
                <span class="state-dot"></span><span id="saveText">正在载入…</span>
              </div>
              <span class="foot-pct" id="filledPct">0%</span>
            </div>
            <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
            <p class="side-meta"
              ><span id="filledCount">0</span> / <span id="totalCount">0</span> 项已填写</p
            >
          </div>
        </nav>

        <div
          class="splitter"
          id="splitLeft"
          role="separator"
          aria-orientation="vertical"
          aria-label="拖动调整侧栏宽度"
          tabindex="0"
          ><span class="splitter-grip"></span
        ></div>

        <main class="editor" id="editor">
          <div class="editor-head">
            <p class="eyebrow" id="groupEyebrow">模块 01</p>
            <h2 id="groupTitle">个人信息</h2>
            <p class="group-desc" id="groupDesc">按模块填写，右侧实时预览。</p>
            <label class="search">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <circle
                  cx="9"
                  cy="9"
                  r="5.6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <path
                  d="M13.2 13.2 17 17"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
              <input
                id="searchInput"
                type="search"
                placeholder="搜索字段或内容"
                aria-label="搜索字段"
              />
            </label>
          </div>
          <div class="form" id="form"></div>
        </main>

        <div
          class="splitter"
          id="splitRight"
          role="separator"
          aria-orientation="vertical"
          aria-label="拖动调整预览宽度"
          tabindex="0"
          ><span class="splitter-grip"></span
        ></div>

        <section class="preview" id="preview" aria-label="简历实时预览">
          <div class="preview-head">
            <div class="preview-title">
              <p class="eyebrow">Live preview</p>
              <h2>A4 · 双页</h2>
            </div>
            <div class="zoom" role="group" aria-label="预览缩放">
              <button type="button" id="zoomOut" aria-label="缩小">−</button>
              <button type="button" id="zoomLabel" class="zoom-label" title="点击恢复自适应缩放"
                >70%</button
              >
              <button type="button" id="zoomIn" aria-label="放大">+</button>
            </div>
            <div class="preview-actions">
              <button type="button" class="btn primary" id="btnPdf">导出 PDF</button>
            </div>
          </div>
          <div class="preview-scroll" id="previewScroll">
            <div class="paper-holder" id="paperHolder">
              <div class="paper-stage" id="paperStage">
                <iframe id="previewFrame" title="简历预览" sandbox=""></iframe>
              </div>
            </div>
          </div>
          <div class="preview-foot">
            <span id="previewHint">页面按 A4 210 × 297 mm 渲染</span>
            <span>2 页</span>
          </div>
        </section>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
